services:
  - type: web
    name: license-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: license-platform-db
          property: connectionString
      - key: JwtSettings__SecretKey
        generateValue: true
      - key: JwtSettings__Issuer
        value: LicensePlatform
      - key: JwtSettings__Audience
        value: LicensePlatformApp
      - key: AdminSettings__DefaultUsername
        value: admin
      - key: AdminSettings__DefaultPassword
        value: admin123
    healthCheckPath: /health
    autoDeploy: true

  - type: postgresql
    name: license-platform-db
    databaseName: license_platform
    plan: free
